<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .admin-container{
            padding:40px;
        }

        .stats{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
            margin-top:30px;
        }

        .stat-card{
            background:rgba(255,255,255,0.1);
            padding:25px;
            border-radius:18px;
            backdrop-filter:blur(10px);
        }

        .stat-card h2{
            margin-bottom:10px;
            color:#38bdf8;
        }

        table{
            width:100%;
            margin-top:30px;
            border-collapse:collapse;
            background:rgba(255,255,255,0.08);
            border-radius:15px;
            overflow:hidden;
        }

        th,td{
            padding:15px;
            text-align:left;
        }

        th{
            background:#2563eb;
        }

        tr:nth-child(even){
            background:rgba(255,255,255,0.05);
        }

        .delete-btn{
            background:#ef4444;
            border:none;
            padding:8px 14px;
            color:white;
            border-radius:8px;
            cursor:pointer;
        }

        .edit-btn{
            background:#22c55e;
            border:none;
            padding:8px 14px;
            color:white;
            border-radius:8px;
            cursor:pointer;
            margin-right:10px;
        }

        .section-title{
            margin-top:50px;
        }

    </style>

</head>
<body>

<div class="navbar">

    <div class="logo">
        AI<span>Interview</span>
    </div>

    <a href="#" onclick="logout()">Logout</a>

</div>

<div class="admin-container">

    <h1>Admin Dashboard</h1>

    <div class="stats">

        <div class="stat-card">
            <h2>Total Users</h2>
            <p id="totalUsers">0</p>
        </div>

        <div class="stat-card">
            <h2>Total Uploads</h2>
            <p id="totalUploads">0</p>
        </div>

        <div class="stat-card">
            <h2>Total Admins</h2>
            <p id="totalAdmins">0</p>
        </div>

    </div>

    <h2 class="section-title">Manage Users</h2>

    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>

        </thead>

        <tbody id="usersTable">

        </tbody>

    </table>

    <h2 class="section-title">Uploaded Certificates</h2>

    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Filename</th>
                <th>File Path</th>
                <th>Uploaded Time</th>
            </tr>

        </thead>

        <tbody id="uploadsTable">

        </tbody>

    </table>

</div>

<script>

function logout(){

    localStorage.clear();

    window.location.href = "login.html";
}

/* =========================
   LOAD STATS
========================= */

async function loadStats(){

    try{

        const response = await fetch(
            "http://localhost:5001/api/admin/stats"
        );

        const data = await response.json();

        document.getElementById("totalUsers").innerText =
            data.totalUsers;

        document.getElementById("totalUploads").innerText =
            data.totalUploads;

        document.getElementById("totalAdmins").innerText =
            data.totalAdmins;

    }catch(error){

        console.log(error);
    }
}

/* =========================
   LOAD USERS
========================= */

async function loadUsers(){

    try{

        const response = await fetch(
            "http://localhost:5001/api/admin/users"
        );

        const users = await response.json();

        const table = document.getElementById("usersTable");

        table.innerHTML = "";

        users.forEach(user => {

            table.innerHTML += `
            
            <tr>

                <td>${user.id}</td>

                <td>${user.name}</td>

                <td>${user.email}</td>

                <td>${user.role}</td>

                <td>

                    <button 
                        class="edit-btn"
                        onclick="editUser(
                            ${user.id},
                            '${user.name}',
                            '${user.email}',
                            '${user.role}'
                        )"
                    >
                        Edit
                    </button>

                    <button 
                        class="delete-btn"
                        onclick="deleteUser(${user.id})"
                    >
                        Delete
                    </button>

                </td>

            </tr>
            
            `;
        });

    }catch(error){

        console.log(error);
    }
}

/* =========================
   DELETE USER
========================= */

async function deleteUser(id){

    if(!confirm("Delete this user?")) return;

    try{

        await fetch(
            `http://localhost:5001/api/admin/users/${id}`,
            {
                method:"DELETE"
            }
        );

        alert("User deleted successfully");

        loadUsers();

        loadStats();

    }catch(error){

        console.log(error);
    }
}

/* =========================
   EDIT USER
========================= */

async function editUser(id,name,email,role){

    const newName = prompt("Enter new name",name);

    const newEmail = prompt("Enter new email",email);

    const newRole = prompt("Enter role",role);

    if(!newName || !newEmail || !newRole) return;

    try{

        await fetch(
            `http://localhost:5001/api/admin/users/${id}`,
            {
                method:"PUT",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    name:newName,
                    email:newEmail,
                    role:newRole
                })
            }
        );

        alert("User updated successfully");

        loadUsers();

    }catch(error){

        console.log(error);
    }
}

/* =========================
   LOAD UPLOADS
========================= */

async function loadUploads(){

    try{

        const response = await fetch(
            "http://localhost:5001/api/admin/uploads"
        );

        const uploads = await response.json();

        const table = document.getElementById("uploadsTable");

        table.innerHTML = "";

        uploads.forEach(upload => {

            table.innerHTML += `
            
            <tr>

                <td>${upload.id}</td>

                <td>${upload.filename}</td>

                <td>${upload.filepath}</td>

                <td>${upload.uploaded_at}</td>

            </tr>
            
            `;
        });

    }catch(error){

        console.log(error);
    }
}

loadStats();

loadUsers();

loadUploads();

</script>

</body>
</html>
